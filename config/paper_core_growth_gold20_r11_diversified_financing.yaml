name: paper_core_growth_gold20_r11_diversified_financing
strategy_label: R11
release: 2026-07-27-r11-v1
status: staged_production
parent_strategy: paper_core_growth_gold20_r9_staged_reentry_netted_ensemble
purpose: Preserve R9 regime and recovery logic while modestly scaling every non-cash sleeve, retaining the causal SMH gap guard, and using only a small GDE substitution.

risk_budget:
  target_non_cash_multiplier: 1.065
  financing_leg: CASH
  maximum_negative_cash_weight: -0.18
  modeled_current_financing_spread_bps: 100
  modeled_stress_financing_spread_bps: 150

capital_efficiency:
  instrument: GDE
  mechanism: Approximately 90% U.S. large-cap equity plus 90% gold futures per dollar invested.
  replaced_asset: GOLD
  maximum_gold_sleeve_substitution_fraction: 0.10
  growth_gate_denominator: 0.80
  account_weight_no_trade_band: 0.02
  financing_aware_proxy:
    SPX: 0.90
    GOLD: 0.90
    CASH: -0.80
  live_tracking_error_annualized: 0.091426
  fund_expense_ratio: 0.0020

smh_gap_guard:
  signal_observed_at_open: true
  execution_delay_trading_days: 1
  absolute_smh_gap_trigger: -0.025
  relative_smh_minus_qqq_gap_trigger: -0.005
  minimum_pretrigger_smh_weight: 0.639
  post_trigger_smh_cap: 0.15
  overflow_asset: CASH
  recovery_signal: SMH daily return minus QQQ daily return is positive
  recovery_confirmations: 2
  maximum_hold_trading_days: 4
  modeled_emergency_slippage_bps: 20

execution:
  ordinary_assets_one_way_cost_bps: 7.5
  stress_ordinary_assets_one_way_cost_bps: 15
  gde_current_liquidity_one_way_cost_bps: 40
  gde_stress_one_way_cost_bps: 75
  gde_order_type: limit_only
  block_market_orders: true
  require_current_gde_quote: true
  require_real_positions: true
  preserve_gold_plus_gde_account_weight: true
  require_financing_cost_observation: true

rollout:
  initial_r11_share_of_managed_capital: 0.25
  remaining_r9_share_of_managed_capital: 0.75
  forward_freeze_price_as_of: 2026-07-24
  first_forward_session: 2026-07-27
  minimum_sessions_before_each_increase: 63
  possible_r11_shares:
    - 0.25
    - 0.50
    - 1.00
  increase_requirements:
    - complete_daily_signal_and_execution_log
    - no_data_integrity_failure
    - realized_gde_one_way_cost_not_above_75bps
    - realized_financing_spread_not_above_150bps
    - r11_relative_drawdown_not_worse_than_r9_by_more_than_2pct
    - no_unresolved_operational_incident
  immediate_order_blocks:
    - stale_core_prices
    - stale_gde_quote
    - missing_real_positions
    - missing_guard_state
  fallback: Keep the affected capital in R9; do not liquidate solely because a rollout review fails.

