data:
  # Liquid US-listed proxies for the paper's five economic sleeves.
  tickers:
    SPX: SPY
    BOND: IEF
    GOLD: GLD
    OIL: DBC
    USD: UUP
    CASH: BIL
  regime_assets: [SPX, BOND, GOLD, OIL, USD]
  cash_asset: CASH
  start: "2008-01-01"
  end: null
  cache: "data/prices.csv"

features:
  volatility_days: 60
  momentum_days: 20

model:
  # Four years limits stale-history contamination; validation is wholly in the past.
  lookback_days: 1008
  validation_days: 126
  candidate_states: [2, 3, 4]
  template_count: 4
  model_refit_days: 21
  order_selection_days: 63
  n_iter: 125
  restarts: 2
  complexity_penalty: 0.02
  template_smoothing: 0.12
  covariance_floor: 1.0e-6
  random_seed: 42

portfolio:
  risk_aversion: 4.0
  turnover_penalty: 0.003
  max_risky_weight: 0.40
  conditional_mean_shrinkage: 0.60
  conditional_covariance_shrinkage: 0.35
  annual_return_floor: -0.10
  annual_return_cap: 0.25
  target_volatility: 0.09
  no_trade_turnover: 0.01
  cost_bps_per_dollar_traded: 7.5
  # Slow signals reduce reliance on noisy daily state-conditional means.
  trend_horizons: [21, 63, 126, 252]
  trend_weights: [0.10, 0.20, 0.30, 0.40]
  trend_forecast_scale: 0.08
  trend_blend: 0.65
  growth_assets: [SPX, OIL]
  stress_momentum_days: 200
  stress_volatility_days: 20
  stress_volatility_threshold: 0.25
  stress_growth_multiplier: 0.25
  # DeMiguel-style 1/N prior guards against unstable optimized expected returns.
  strategic_core_blend: 0.50
  drawdown_overlay:
    - {threshold: -0.10, risky_multiplier: 0.25}
    - {threshold: -0.07, risky_multiplier: 0.50}
    - {threshold: -0.04, risky_multiplier: 0.75}

backtest:
  oos_start: "2015-01-02"
  rebalance_every_days: 5
  annualization: 252
  output_dir: "output/backtest_v3"
