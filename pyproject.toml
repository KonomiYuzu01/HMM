[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasserstein-regime-strategy"
version = "0.1.0"
description = "A causal, tradable implementation inspired by Explainable Regime-Aware Investing"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0",
  "cvxpy>=1.6",
  "hmmlearn>=0.3.3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
regime-backtest = "regime_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
